[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-rag"
version = "0.1.0"
description = "Reproducible Vietnamese legal RAG and Agentic RAG v1 research package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.5.2",
    "python-docx>=1.1,<2",
    "rank-bm25==0.2.2",
    "torch==2.5.1",
    "transformers==4.46.3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
